[project]
name = "visualclaude"
version = "0.1.0"
description = "MCP service for building DAG plans and watching agents execute them node by node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2.100",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
visualclaude = "visualclaude.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visualclaude"]
