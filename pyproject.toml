[project]
name = "clearbox"
version = "0.1.0"
description = "Observable, reviewable agent work: DAG plans over MCP, executed node by node and watched live"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2.100",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
]

[project.scripts]
clearbox = "clearbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearbox"]
