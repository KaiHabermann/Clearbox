[project]
name = "clearbox"
version = "0.2.1"
description = "Observable, reviewable agent work: DAG plans over MCP, executed node by node and watched live"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kai Habermann" }]
keywords = ["agents", "mcp", "llm", "dag", "orchestration", "claude", "openai", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2.100",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/KaiHabermann/Clearbox"
Repository = "https://github.com/KaiHabermann/Clearbox"
Issues = "https://github.com/KaiHabermann/Clearbox/issues"

[project.scripts]
clearbox = "clearbox.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]          # >=1.27 understands the PEP 639 `license` / `license-files` fields
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearbox"]                 # includes clearbox/static/*, which the UI needs at runtime

[tool.hatch.build.targets.sdist]
# Ship the source needed to build and verify the package; leave the working material out.
include = ["clearbox", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
