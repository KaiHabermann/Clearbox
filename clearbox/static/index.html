<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span class="logo"></span>Clearbox</div>
    <div class="section-label">Plans</div>
    <ul id="plan-list"></ul>
    <div class="section-label agents-label">
      <span>Agents</span>
      <button id="agent-all" class="link" title="overview of all agent profiles">all</button>
    </div>
    <ul id="agent-list" aria-label="agent profiles"></ul>
    <div class="agent-new-wrap"><button id="agent-new" title="connect an OpenAI-compatible endpoint, a Claude model or a mock agent">+ New agent</button></div>
    <div class="sidebar-foot">
      <span id="conn" class="conn off" title="live connection"></span>
      <span id="conn-text">connecting…</span>
      <span id="version" class="version"></span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <nav id="crumbs"></nav>
      <span id="plan-status" class="pill"></span>
      <span id="plan-review" class="menu"></span>
      <span id="plan-workdir" class="workdir-ctl"></span>
      <span id="plan-tests" class="workdir-ctl"></span>
      <span id="plan-isolate" class="workdir-ctl"></span>
      <span id="plan-agent" class="agent-ctl"></span>
      <span id="plan-review-agent" class="agent-ctl"></span>
      <div class="spacer"></div>
      <div id="controls"></div>
    </header>
    <div id="active-bar"></div>
    <div id="canvas-wrap">
      <svg id="canvas">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="arrow-head"></path>
          </marker>
          <marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="arrow-head done"></path>
          </marker>
          <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="arrow-head active"></path>
          </marker>
          <marker id="arrow-files" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M1,1 L9,5 L1,9" class="arrow-head files"></path>
          </marker>
        </defs>
        <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
      </svg>
      <div id="empty" class="empty hidden"></div>
      <div id="legend">
        <span><i class="dot pending"></i>pending</span>
        <span><i class="dot ready"></i>ready</span>
        <span><i class="dot running"></i>running</span>
        <span><i class="dot done"></i>done</span>
        <span><i class="dot failed"></i>failed</span>
        <span><i class="stack-icon"></i>subplan</span>
        <span title="a step a person does (push a branch, open the MR, approve); no agent runs it and the plan waits there until you mark it done"><i class="user-job-icon"></i>your job</span>
        <span title="these nodes write the same file, so they take turns: lowest node number first, each later one drawn a step lower"><i class="fconn-icon"></i>shares files — runs after</span>
        <span title="agent harness colours; a filled dot on a node's agent chip = set on that node"><i class="hswatch h-claude-sdk"></i>claude-sdk</span>
        <span><i class="hswatch h-openai"></i>openai</span>
        <span><i class="hswatch h-mock"></i>mock</span>
      </div>
      <div id="zoom">
        <button data-z="in" title="zoom in">+</button>
        <button data-z="out" title="zoom out">−</button>
        <button data-z="fit" title="fit to screen">⤢</button>
      </div>
    </div>
  </main>

  <aside id="drawer" class="closed">
    <div id="drawer-head"></div>
    <div id="drawer-body">
      <div id="node-info"></div>
      <div class="transcript-head" id="transcript-head">
        <span>Agent session</span>
        <label class="follow"><input type="checkbox" id="follow" checked> follow</label>
      </div>
      <div id="transcript"></div>
    </div>
  </aside>

  <div id="full-view" class="closed">
    <div id="full-topbar">
      <button id="full-prev" class="nav-btn" title="previous node (k / ←)">‹</button>
      <div id="full-head-slot"></div>
      <button id="full-next" class="nav-btn" title="next node (j / →)">›</button>
      <div id="full-tabs" role="tablist">
        <button class="ftab" data-tab="task" role="tab" title="task, agent and result (1)">Task</button>
        <button class="ftab" data-tab="changes" role="tab" title="file diffs (2)">Changes</button>
        <button class="ftab" data-tab="output" role="tab" title="agent session (3)">Agent output</button>
        <button class="ftab" data-tab="review" role="tab" title="review verdict and findings (4)">Review</button>
      </div>
      <div class="spacer"></div>
      <button id="full-exit" class="close" title="exit full screen (Esc)">⤡ Exit full screen</button>
    </div>
    <div id="full-body">
      <section class="fpane" data-pane="task"><div id="full-info-col"></div></section>
      <section class="fpane" data-pane="changes">
        <div id="full-file-list"></div>
        <div id="full-diff"></div>
      </section>
      <section class="fpane" data-pane="output"><div id="full-transcript-col"></div></section>
      <section class="fpane" data-pane="review"><div id="full-review"></div></section>
    </div>
  </div>

  <aside id="agent-drawer" class="closed" aria-labelledby="agent-title">
    <div id="agent-head"></div>
    <div id="agent-body"></div>
  </aside>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
